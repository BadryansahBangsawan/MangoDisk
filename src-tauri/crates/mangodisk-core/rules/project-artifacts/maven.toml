id = "project.maven-build-artifacts"
schema_version = 1
rule_version = 2
platforms = ["macos", "windows"]
category = "development"
risk = "recoverable"
default_selected = false

[match]
file_names_any = ["pom.xml"]

[[artifacts]]
kind = "relativeDirectory"
path = "target"

[[artifacts]]
kind = "descendantDirectory"
name = "target"
max_depth = 8

[verification]
lifecycle = "verified"
evidence = [
  "https://maven.apache.org/plugins/maven-clean-plugin/usage.html",
  "https://maven.apache.org/guides/mini/guide-multiple-modules.html",
]
verified_at = "2026-09-16"
